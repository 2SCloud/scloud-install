# ──────────────────────────────────────────────────────────────────────────────
# 2SCloud stack, beta channel: CHANNEL=beta ./install.sh
#
# Same format as stack.yml. The "Update stack" workflow opens a PR here for
# every new beta (X.Y.Z-beta.<build number>, built from develop) and every new
# release. A component pinned to a branch (e.g. "main") is never updated.
# ──────────────────────────────────────────────────────────────────────────────

scloud-dns:
  # Git tag of 2SCloud/scloud-dns, also used as the tag of the deployed image
  version: 0.3.2
  image: ghcr.io/2scloud/scloud-dns

scloud-observability:
  # Git tag of 2SCloud/scloud-observability
  version: 0.1.1.3

scloud-edge-gateway:
  # Git tag of 2SCloud/scloud-edge-gateway (a branch or commit is never updated)
  version: 0.2.0
