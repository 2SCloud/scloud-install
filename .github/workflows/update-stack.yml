name: Update stack

# Keeps stack.yml (releases) and stack-beta.yml (betas) up to date: opens one
# PR per component when a newer GitHub release / pre-release exists.
#   - right away when a component's release workflow sends "component-released"
#   - every hour as a safety net (components without a release workflow)
#   - by hand from the Actions tab
#
# Setup (org-level is easiest, shared with the component repos):
#   - variable SCLOUD_BOT_CLIENT_ID  : Client ID of the 2SCloud bot GitHub App
#   - secret   SCLOUD_BOT_PRIVATE_KEY: private key of that GitHub App
#   The App needs Contents + Pull requests (read & write) on scloud-install.

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [component-released]
  workflow_dispatch:
    inputs:
      component:
        description: Only this component (empty = all)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-stack
  cancel-in-progress: false

jobs:
  update:
    name: Update stack files
    runs-on: ubuntu-latest

    steps:
      - name: Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCLOUD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SCLOUD_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Open / update PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          READ_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          ONLY: ${{ github.event.client_payload.component || inputs.component }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/update-stack.sh
